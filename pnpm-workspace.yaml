packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true

catalog:
  "@base-ui/react": ^1.9.0
  "@effect/tsgo": ^0.63.0
  "@oxlint/plugins": ^1.90.0
  "@shadcn/lint": ^0.2.3
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  class-variance-authority: ^0.7.1
  cn: ^0.5.1
  eslint-plugin-turbo: ^2.11.10
  lefthook: ^2.2.2
  oxfmt: ^0.75.0
  oxlint: ^1.90.0
  oxlint-tsgolint: ^7.0.2005
  # Matches nixpkgs' playwright-driver, so local runs use the dev shell's
  # Chromium.
  playwright: 1.59.1
  react: ^19.3.1
  react-doctor: ^0.9.18
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  tsdown: ^0.23.4
  turbo: ^2.11.10
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: ^8.3.5
  vite-plugin-singlefile: ^2.3.4
  vitest: ^5.0.5

catalogs:
  effect:
    "@effect/platform-node": 4.1.0
    "@effect/vitest": 4.1.0
    effect: 4.1.0

minimumReleaseAge: 1440

# @effect/platform-node declares `@effect/platform-node-shared: ^4.1.0`.
# Keep the shared package on the same release as effect, so a newer shared
# patch can't target effect APIs the pinned effect doesn't have.
overrides:
  "@effect/platform-node-shared": 4.1.0
