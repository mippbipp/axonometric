pre-commit:
  parallel: true
  jobs:
    - run: pnpm ox:fix
      glob:
        - "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
        - "**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
      stage_fixed: true
    # Blocks the commit on any React Doctor finding in the staged editor files.
    - name: react-doctor
      glob:
        - "packages/editor/**/*.{ts,tsx,js,jsx,mjs,cjs}"
      run: pnpm exec react-doctor packages/editor --staged --blocking warning --no-score --yes
