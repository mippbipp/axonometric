pre-commit:
  parallel: true
  jobs:
    - run: gh actions-lock --verify-local
      glob: ".github/workflows/*.{yml,yaml,lock}"
    - run: bun run ox:fix
      glob:
        - "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
        - "**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
      stage_fixed: true
    # Blocks the commit on any React Doctor finding in the staged editor and ui files.
    - name: react-doctor
      glob:
        - "packages/editor/**/*.{ts,tsx,js,jsx,mjs,cjs}"
        - "packages/ui/**/*.{ts,tsx,js,jsx,mjs,cjs}"
      run: bunx react-doctor --project @axonometric/editor,@axonometric/ui --staged --blocking warning --no-score --yes
