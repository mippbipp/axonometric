name: tmp-list
on:
  pull_request:
jobs:
  list:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: |
          set -e
          rm -rf /tmp/lt && mkdir /tmp/lt && cd /tmp/lt
          cp -R "$GITHUB_WORKSPACE"/package.json "$GITHUB_WORKSPACE"/bun.lock "$GITHUB_WORKSPACE"/bunfig.toml "$GITHUB_WORKSPACE"/packages .
          export BUN_INSTALL_CACHE_DIR=/tmp/lt-cache
          bun install --frozen-lockfile --filter axonometric --os '*' --cpu '*' --ignore-scripts --backend copyfile --no-progress >/dev/null
          find . -name node_modules -type d -prune -print0 | xargs -0 -I{} find {} \( -type l -o -type f -o -type d \) | sort > /tmp/list-mac.txt
          wc -l /tmp/list-mac.txt
      - uses: actions/upload-artifact@v7
        with:
          name: list-mac
          path: /tmp/list-mac.txt
