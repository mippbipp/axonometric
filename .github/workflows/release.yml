name: Release

# On a version tag, builds the single-executable binaries, stages the npm
# package and publishes the binaries as a GitHub Release. On a push to main,
# and on a pull request that changes how the binaries are built or installed,
# it runs the same builds and checks without releasing anything. Other pull
# requests skip it, and the push to main catches whatever they break.

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packages/cli/tsdown.config.ts
      - packages/cli/scripts/**
      - packages/cli/package.json
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reads the version once, for every job after it. On a tag, the tag must
  # match packages/cli/package.json. A version with a suffix, such as
  # 0.1.0-rc.1, is a pre-release.
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version=$(jq -r .version packages/cli/package.json)

          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, but packages/cli/package.json says $version." >&2
            exit 1
          fi

          case $version in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          echo "Version $version, pre-release: $prerelease"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

  binary:
    name: binary (${{ matrix.target }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, archive: tar.gz }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, archive: tar.gz }
          - { target: darwin-x64, runner: macos-15-intel, archive: tar.gz }
          - { target: darwin-arm64, runner: macos-15, archive: tar.gz }
          - { target: windows-x64, runner: windows-2025, archive: zip }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: axonometric-${{ matrix.target }}.${{ matrix.archive }}
      BINARY: axonometric-${{ matrix.target }}/axonometric${{ matrix.archive == 'zip' && '.exe' || '' }}

    steps:
      - uses: actions/checkout@v7

      # Installs pnpm from `packageManager` and Node from `devEngines.runtime`,
      # then runs `pnpm install --frozen-lockfile`. The binary is a copy of
      # that Node.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm turbo run build --filter axonometric

      - run: pnpm --filter axonometric build:sea

      - name: Smoke-test the binary
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: packages/cli/scripts/smoke-binary.sh "packages/cli/release/$BINARY" "$VERSION"

      - name: Write a checksum for the install test
        working-directory: packages/cli/release
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" >SHA256SUMS
          else
            shasum -a 256 "$ARCHIVE" >SHA256SUMS
          fi

      - name: Test install.sh
        if: runner.os != 'Windows'
        run: scripts/test-install.sh packages/cli/release

      - name: Test install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1 packages/cli/release

      - uses: actions/upload-artifact@v7
        with:
          name: axonometric-${{ matrix.target }}
          path: packages/cli/release/${{ env.ARCHIVE }}
          if-no-files-found: error
          # The archives are already compressed.
          compression-level: 0

  # Builds, packs and checks the npm tarball, without an OIDC token, so
  # nothing in the install or build can request one.
  npm-pack:
    needs: meta
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    outputs:
      node-version: ${{ steps.node.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      # npm's docs advise against caching in release builds.
      - uses: pnpm/setup@v3
        with:
          cache: false
          require-lockfile: true

      - run: pnpm turbo run build --filter axonometric

      # The same pack and check as CI.
      - run: pnpm --filter axonometric pack:npm "$RUNNER_TEMP/axonometric.tgz"

      - id: node
        run: echo "version=$(jq -r .devEngines.runtime.version package.json)" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/axonometric.tgz
          if-no-files-found: error

  # Stages the checked tarball through trusted publishing. npm trusts this
  # workflow file and the `npm` environment, so no token is stored anywhere.
  # The staged version goes live once the maintainer approves it with 2FA.
  # This job has the OIDC token, so it checks out nothing and runs no project
  # code. `--provenance` requests a provenance statement explicitly.
  npm:
    needs: [meta, binary, npm-pack]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm

      # No registry-url, so no .npmrc expects a token.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.npm-pack.outputs.node-version }}
          package-manager-cache: false

      # npm stage publish needs npm 11.15.0 or newer.
      - run: npm install -g --ignore-scripts npm@11.21.1

      # A pre-release must name its tag, and the tag can't change after
      # staging.
      - name: Stage the npm package
        run: |
          tag=latest
          if [ "$PRERELEASE" = true ]; then
            tag=next
          fi
          npm --version
          npm stage publish "$RUNNER_TEMP/npm/axonometric.tgz" \
            --tag "$tag" \
            --provenance

  release:
    needs: [meta, binary]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: axonometric-*
          path: release
          merge-multiple: true

      - name: Add the install scripts and checksums
        working-directory: release
        run: |
          cp ../scripts/install.sh ../scripts/install.ps1 .
          sha256sum axonometric-* install.sh install.ps1 >SHA256SUMS
          cat SHA256SUMS

      # The install commands pin this release's version, because GitHub's
      # "latest" release skips pre-releases.
      - name: Write the release notes
        working-directory: release
        run: |
          node_version=$(jq -r .devEngines.runtime.version ../package.json)
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          {
            echo "Install on Linux or macOS:"
            echo
            echo '```sh'
            echo "curl -fsSL $base/install.sh | AXONOMETRIC_VERSION=$VERSION sh"
            echo '```'
            echo
            echo "Install on Windows, in PowerShell:"
            echo
            echo '```powershell'
            echo "\$env:AXONOMETRIC_VERSION = '$VERSION'; irm $base/install.ps1 | iex"
            echo '```'
            echo
            echo "Each archive holds one binary with Node $node_version built in, so you don't need Node installed. The macOS binaries have an ad-hoc signature and aren't notarized. The Windows binary isn't signed. SHA256SUMS lists every file's checksum."
            echo
            echo "The npm package \`axonometric@$VERSION\` is staged on npm and goes live once the maintainer approves it."
            echo
            echo "| Download | Size |"
            echo "| --- | --- |"
            for file in *; do
              bytes=$(stat -c %s "$file")
              echo "| \`$file\` | $(awk -v b="$bytes" 'BEGIN { if (b < 1000000) printf "%.1f KB", b / 1000; else printf "%.1f MB", b / 1000000 }') |"
            done
          } >../notes.md
          cat ../notes.md

      # A draft until the npm package is staged, so a failed npm job doesn't
      # leave a public release without its npm package.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then
            prerelease=(--prerelease)
          fi
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "v$VERSION" \
            --notes-file notes.md \
            "${prerelease[@]}"

  publish-release:
    needs: [meta, release, npm]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
