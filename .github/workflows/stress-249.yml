name: Stress 249

on:
  push:
    branches: [ticket/249-inert-flake]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: bun ci
      - name: Find the Playwright version
        id: playwright
        shell: bash
        run: |
          version=$(sed -n 's/^    "playwright": \["playwright@\([^"]*\)".*/\1/p' bun.lock | head -n 1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=${{ runner.temp }}/ms-playwright" >>"$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        id: browsers
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download Chromium for Playwright
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: packages/cli
        run: bunx playwright install --only-shell chromium
      - name: Build
        run: bunx turbo run build --filter=axonometric
      - name: Run the two files 30 times
        working-directory: packages/cli
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 30); do
            echo "::group::run $i"
            if ! bunx vitest run test/review-page.test.ts test/overview.test.ts --reporter=verbose; then
              fails=$((fails + 1))
              echo "RUN $i FAILED"
            fi
            echo "::endgroup::"
          done
          echo "RESULT: $fails of 30 runs failed"
          [ "$fails" -eq 0 ]
