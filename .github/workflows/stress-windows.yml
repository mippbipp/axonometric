name: Stress Windows flakes (temporary)

on:
  push:
    branches: [ticket/windows-flakes]
  workflow_dispatch:
    inputs:
      runs:
        description: Loops per file
        default: "60"

permissions:
  contents: read

jobs:
  stress:
    name: stress ${{ matrix.file }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { file: structure-page, os: ubuntu-24.04 }
          - { file: structure-page, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      # The tests and the bundle run on the Node that npm users have.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: bun ci

      - run: node --version

      # The page tests open the built page in Chromium. Locally, the dev
      # shell provides it. They launch it headless, so only the headless
      # shell is installed. One path on every OS lets one cache step serve all
      # three, and the key changes with the Playwright version in the
      # lockfile.
      - name: Find the Playwright version
        id: playwright
        shell: bash
        run: |
          version=$(sed -n 's/^    "playwright": \["playwright@\([^"]*\)".*/\1/p' bun.lock | head -n 1)
          if [ -z "$version" ]; then
            echo "No playwright version in bun.lock." >&2
            exit 1
          fi
          echo "Playwright $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=${{ runner.temp }}/ms-playwright" >>"$GITHUB_ENV"

      - uses: actions/cache@v6.1.0
        id: browsers
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Download Chromium for Playwright
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: packages/cli
        run: bunx playwright install --only-shell chromium

      # The system libraries live outside the cache.
      - name: Install Chromium's system libraries
        if: runner.os == 'Linux'
        working-directory: packages/cli
        run: bunx playwright install-deps chromium

      - name: Chromium libraries
        if: runner.os == 'Linux'
        working-directory: packages/cli
        run: bunx playwright install-deps chromium

      - name: Build
        run: bunx turbo run build --filter=axonometric

      - name: Loop the test file
        shell: bash
        working-directory: packages/cli
        env:
          RUNS: ${{ inputs.runs || '60' }}
        run: |
          fails=0
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i"
            if bunx vitest run test/${{ matrix.file }}.test.ts --reporter=verbose >"$RUNNER_TEMP/out.txt" 2>&1; then
              echo "RESULT run $i pass"
            else
              echo "RESULT run $i FAIL"
              fails=$((fails + 1))
            fi
            grep -E "PROBE|FAIL|AssertionError|expected" "$RUNNER_TEMP/out.txt" || true
            echo "::endgroup::"
          done
          echo "SUMMARY ${{ matrix.file }}: $fails failures in $RUNS runs"
          if [ "$fails" -gt 0 ]; then echo "::warning::$fails failures in $RUNS runs"; fi
