name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # Installs pnpm from `packageManager` and Node from `devEngines.runtime`,
      # then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: node --version

      - run: pnpm ox

      - run: pnpm test

      - name: Run the built bundle
        run: |
          node packages/cli/dist/bin.mjs --version
          node packages/cli/dist/bin.mjs --help
