name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # Installs pnpm from `packageManager` and Node from `devEngines.runtime`,
      # then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: node --version

      - run: pnpm ox

      # The page tests open the built page in Chromium. Locally, the dev
      # shell provides it.
      - name: Install Chromium for Playwright
        run: pnpm --filter axonometric exec playwright install --with-deps chromium

      - run: pnpm test

      - name: Run the built bundle
        run: |
          node packages/cli/dist/bin.mjs --version
          node packages/cli/dist/bin.mjs --help

      # Packs the npm tarball the same way the release workflow does, then
      # checks its files and package.json. See packages/cli/scripts/pack-npm.ts.
      - name: Check the npm tarball
        if: runner.os == 'Linux'
        run: pnpm --filter axonometric pack:npm "$RUNNER_TEMP/axonometric.tgz"

  # npm trusted publishing needs no token, so no workflow may pass one. The
  # pattern is split so this file doesn't match itself.
  no-npm-token:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check that no workflow uses an npm token
        run: |
          if grep -rnE 'N(PM|ODE_AUTH)_TOKEN' .github; then
            echo "A workflow refers to an npm token. Releases stage through trusted publishing instead." >&2
            exit 1
          fi

  nix:
    strategy:
      fail-fast: false
      matrix:
        # x86_64-linux and aarch64-darwin. aarch64-linux is the maintainer's
        # machine.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Restores /nix and saves it after a successful job. It uses the GitHub
      # Actions cache with the job's own token, so no secret is added. The key
      # includes pnpm-lock.yaml and has no fallback prefix. The pnpm deps are a
      # fixed-output derivation, so with a stale `pnpmDeps.hash` a restored
      # store would already hold them, and the build would skip the check that
      # prints `got: sha256-...`.
      - name: Read the pnpm deps hash
        id: pnpm-deps
        run: echo "hash=$(grep -o 'sha256-[^"]*' nix/package.nix | head -n 1)" >>"$GITHUB_OUTPUT"

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'pnpm-lock.yaml') }}-${{ steps.pnpm-deps.outputs.hash }}

      # If pnpm-lock.yaml changed, this fails with a hash mismatch. Copy the
      # `got: sha256-...` value into `pnpmDeps.hash` in nix/package.nix.
      - run: nix build -L .#default

      # Runs the package's install check: --version and a build of the
      # fixture map.
      - run: nix flake check -L

      - run: nix run . -- --version

  react-doctor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      # Fails on any React Doctor finding in the editor.
      - run: pnpm run react-doctor
