<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>axonometric</title>
    <script>
      // Sets the reader's theme before the page draws, so it doesn't flash.
      // theme.tsx owns the key and the values.
      try {
        var theme = localStorage.getItem("axonometric-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
